# GitHub Actions workflow for building and preparing a plugin release:
# - Validate the Gradle wrapper.
# - Run 'check' (unit tests) and Qodana inspections.
# - Run 'buildPlugin' and 'verifyPlugin'.
# - Create a draft release that triggers release.yml once published.
#
# GitHub Actions reference: https://help.github.com/en/actions

name: Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6

      # CLion 2026.2 ships JBR 25 and its platform modules are Java 25 bytecode, so the JDK that
      # compiles the plugin must be 25 (matching `jvmToolchain(25)` in build.gradle.kts). A lower JDK
      # makes `verifyPluginProjectConfiguration` fail the build.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q -PlocalPlatformPath=)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"

          # Release notes are taken from the `[Unreleased]` section; for the first release, where that
          # section is still empty, they fall back to the section of the version being released.
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q -PlocalPlatformPath=)"
          if [ -z "${CHANGELOG//[[:space:]]/}" ]; then
            CHANGELOG="$(./gradlew getChangelog --no-header --project-version="$VERSION" --console=plain -q -PlocalPlatformPath=)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # The build normally points at the local CLion installation (`localPlatformPath`).
      # In CI there is none, so CLion is downloaded from the JetBrains repository instead.
      - name: Build plugin
        run: ./gradlew buildPlugin -PlocalPlatformPath=

      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/distributions
          FILENAME=`ls *.zip`
          unzip "$FILENAME" -d content

          echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests
        run: ./gradlew check -PlocalPlatformPath=

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

  # Static analysis with Qodana. The JVM linters authenticate against Qodana Cloud with a project
  # token; without the `QODANA_TOKEN` secret the job would fail on every run, so the inspection step
  # is skipped and the job stays green. Add the secret to enable it.
  inspectCode:
    name: Inspect code
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Java
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Qodana - Code Inspection
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-default-branch-only: true

  # Compatibility check with the IntelliJ Plugin Verifier. The verification target is the platform
  # the plugin is built against (`ides { current() }` in build.gradle.kts), which CI resolves to
  # CLion 2026.2.4.1 through `platformType`/`platformVersion`. The verifier fails the job on
  # compatibility problems, invalid plugin structure and missing dependencies.
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The verifier resolves the CLion distributions through Gradle, so `setup-gradle`'s cache
      # covers them and no separate IDE cache is needed.
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin -PlocalPlatformPath=

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, inspectCode, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --draft \
            --title "v${{ needs.build.outputs.version }}" \
            --notes "$(cat << 'EOM'
          ${{ needs.build.outputs.changelog }}
          EOM
          )"
