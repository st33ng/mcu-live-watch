# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = dev.st33ng.mculivewatch
pluginName = MCU Live Watch
pluginRepositoryUrl = https://github.com/st33ng/mcu-live-watch
# SemVer format -> https://semver.org
pluginVersion = 3.1.0

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 262

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html#configuration-intellij-extension
# `localPlatformPath` binds the build to the CLion installation on this machine, so the plugin is
# always compiled against the exact build it must run on. CI has no CLion, so it passes
# `-PlocalPlatformPath=` and the platform is downloaded using `platformType` / `platformVersion`.
platformType = CL
platformVersion = 2026.2.4.1
localPlatformPath = /Applications/CLion.app

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformPlugins =
# Bundled plugins the plugin links against at runtime.
platformBundledPlugins = com.intellij.clion,com.intellij.nativeDebug,com.intellij.clion.embedded

# Gradle Releases -> https://github.com/gradle/gradle/releases
# Gradle 9.1+ is required to run on Java 25, which is the JBR shipped with CLion 2026.2.
gradleVersion = 9.8.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# The Kotlin compile daemon cannot start in this sandbox ($HOME/Library is read-only),
# so it failed and fell back on every build. Compile in-process instead.
kotlin.compiler.execution.strategy = in-process
